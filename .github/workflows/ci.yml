name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check API and workers
        run: |
          find apps/api/src apps/api/scripts apps/workers/src -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Build web
        run: npm run build --workspace=@tbi/web
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_RECAPTCHA_SITE_KEY: dummy

      - name: Guard against forbidden files
        run: |
          bad=$(git ls-files | grep -Ei '(\.md$|\.markdown$|__tests__|\.test\.js$|\.spec\.js$|\.pem$|\.key$|(^|/)\.env($|\.))' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
          if git grep -nE 'AKIA[0-9A-Z]{16}|BEGIN (RSA |EC )?PRIVATE KEY' -- . ; then echo "Possible secret found"; exit 1; fi
